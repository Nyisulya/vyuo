{% extends 'universitysite/base.html' %}

{% block content %}
<section class="card rounded-3xl p-6">
    <h2 class="text-xl font-semibold text-slate-900">Mikoa</h2>
    <p class="mt-2 text-sm text-slate-600">Chagua mkoa kuona vyuo vilivyopo.</p>
    <ul class="mt-4 space-y-2">
        {% for region in region %}
        <li>
            <a href="{% url 'universitysite:vyuo' region.id %}"
                class="block rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-800 hover:border-sky-400 hover:bg-sky-50">{{ region.name }}</a>
        </li>
        {% endfor %}
    </ul>
</section>
{% endblock %}
