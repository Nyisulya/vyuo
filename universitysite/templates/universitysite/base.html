<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{% block meta_description %}Gundua vyuo na kozi mbalimbali Tanzania. Pata taarifa kamili kuhusu ada, sifa za kujiunga na programu zote za vyuo kikuu na vyuo vya kati.{% endblock %}" />
    <meta name="keywords" content="Vyuo Tanzania, Kozi, Vyuo Vikuu, Vyuo vya Kati, Sifa za kujiunga, Ada za vyuo, Universities in Tanzania, Courses, TCU, NACTE" />
    <meta name="robots" content="index, follow" />
    <title>
      {% block title %}
        University Portal
      {% endblock %}
    </title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2751QHPWST"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      
      gtag('config', 'G-2751QHPWST')
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f8fafc;
      }
      a {
        transition: color 150ms ease, background-color 150ms ease, transform 150ms ease;
      }
      a:hover {
        transform: translateY(-1px);
      }
      .card {
        background: white;
        border: 1px solid rgba(148, 163, 184, 0.3);
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
      }
      .table-striped tr:nth-child(even) td {
        background-color: #f8fafc;
      }
      .focus-ring:focus-visible {
        outline: 2px solid #0284c7;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body class="min-h-screen text-slate-900">
    <div class="min-h-screen flex flex-col">
      <header class="bg-white border-b border-slate-200 shadow-sm">
        <div class="mx-auto flex max-w-6xl flex-col gap-4 px-4 py-5 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <a href="{% url 'universitysite:home' %}" class="text-2xl font-semibold text-sky-700">Vyuo Tanzania</a>
            <p class="mt-1 text-sm text-slate-500">Tafuta chuo, kozi, na taarifa kwa urahisi.</p>
          </div>
          <nav class="flex flex-wrap gap-3 text-sm font-medium text-slate-700">
            <a href="{% url 'universitysite:home' %}" class="rounded-full bg-slate-100 px-4 py-2 hover:bg-slate-200">Nyumbani</a>
            <span class="rounded-full bg-slate-100 px-4 py-2 text-slate-500">Welcome</span>
          </nav>
        </div>
      </header>

      <main class="flex-1 mx-auto w-full max-w-6xl px-4 py-8">
        {% block content %}

        {% endblock %}
      </main>

      <footer class="bg-slate-900 text-slate-200">
        <div class="mx-auto max-w-6xl px-4 py-6 text-center text-sm">
          <p>Portal ya chuo. Mfumo ulioboreshwa kwa urahisi na muonekano mzuri.</p>
        </div>
      </footer>
    </div>
  </body>
</html>
